[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "smallcode"
version = "0.1.0"
description = "命令行 AI 编码助手 — 本地文件操作、网页搜索与 AI 对话"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "smallcode contributors"},
]
requires-python = ">=3.10"
keywords = ["AI", "coding", "assistant", "cli"]

[tool.setuptools.packages.find]
include = ["smallcode*"]
